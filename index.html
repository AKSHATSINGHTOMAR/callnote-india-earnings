<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f7f3">
<title>Callnote — earnings calls, in sync</title>
<style>
:root{
  --ink:#16201b;
  --ink-soft:#2c3a33;
  --muted:#6c7871;
  --muted-light:#919c95;
  --paper:#f6f7f3;
  --surface:#ffffff;
  --line:#e6e9e2;
  --forest:#182b21;
  --accent:#6b9b47;
  --accent-bright:#baf36a;
  --accent-soft:#eef6e3;
  --word-hl:#d6f1a9;
  font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;color:var(--ink);background:var(--surface);font-size:16px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button{color:inherit}

/* Two-pane layout: companies on the left, player + transcript on the right */
.app{
  display:grid;
  grid-template-columns:300px minmax(0,1fr);
  height:100vh;
  overflow:hidden;
}

/* Left pane: Companies */
.companies{
  background:var(--paper);
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
  height:100vh;
  min-width:0;
}
.companies-head{
  padding:22px 18px 14px;
  border-bottom:1px solid var(--line);
}
.companies-title-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:14px;
}
.companies-title{
  font-size:15px;
  font-weight:700;
  letter-spacing:-.02em;
  color:var(--ink);
}
.count{
  font-size:12px;
  font-weight:600;
  color:var(--muted);
  background:#ebeee8;
  padding:3px 9px;
  border-radius:99px;
}
.filter{
  position:relative;
  display:block;
}
.filter input{
  width:100%;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--surface);
  padding:10px 12px 10px 36px;
  outline:none;
  font-size:14px;
  color:var(--ink);
}
.filter input:focus{
  border-color:#9fc480;
  box-shadow:0 0 0 3px rgba(107,155,71,.12);
}
.filter svg{
  position:absolute;
  left:12px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted-light);
  pointer-events:none;
}
.call-list{
  flex:1;
  overflow-y:auto;
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:4px;
}
.call-card{
  display:flex;
  flex-direction:column;
  gap:4px;
  width:100%;
  border:1px solid transparent;
  background:transparent;
  padding:13px 14px;
  border-radius:11px;
  text-align:left;
  cursor:pointer;
  transition:background .14s,border-color .14s;
}
.call-card:hover{
  background:#edf0e8;
}
.call-card.selected{
  background:var(--surface);
  border-color:#d6e3cb;
  box-shadow:0 2px 8px rgba(22,32,27,.045);
}
.call-company{
  display:block;
  font-size:15px;
  font-weight:650;
  line-height:1.3;
  color:var(--ink);
}
.call-card.selected .call-company{
  color:#1d3b22;
}
.call-meta{
  display:flex;
  justify-content:space-between;
  gap:8px;
  color:var(--muted);
  font-size:12.5px;
  line-height:1.35;
}
.call-meta span:first-child{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.call-meta span:last-child{
  flex:0 0 auto;
}
.empty-lib{
  color:var(--muted);
  font-size:14px;
  line-height:1.6;
  padding:18px 14px;
}
.companies-foot{
  border-top:1px solid var(--line);
  padding:12px 14px;
}
.add-link{
  width:100%;
  border:1px dashed #cfd6ca;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  font-size:13.5px;
  font-weight:550;
  padding:9px 12px;
  border-radius:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  transition:border-color .14s,color .14s,background .14s;
}
.add-link:hover{
  border-color:var(--accent);
  color:var(--ink);
  background:var(--surface);
}

/* Right pane: Player + Transcript */
.reader{
  display:flex;
  flex-direction:column;
  height:100vh;
  min-width:0;
  background:var(--surface);
}

/* Sticky top dock: Call header + Player + Search */
.reader-top{
  flex:0 0 auto;
  border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.97);
  padding:20px 36px 16px;
}
.reader-top-inner{
  max-width:920px;
  margin:0 auto;
}
.call-header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  margin-bottom:16px;
}
.call-header h1{
  margin:0;
  font-size:clamp(22px,2.2vw,28px);
  font-weight:700;
  letter-spacing:-.035em;
  line-height:1.18;
  color:var(--ink);
}
.call-sub{
  margin-top:6px;
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
  color:var(--muted);
  font-size:14px;
}
.sep{
  width:3px;
  height:3px;
  border-radius:50%;
  background:#b8c1ba;
}
.header-links{
  display:flex;
  align-items:center;
  gap:8px;
  flex:0 0 auto;
}
.link-btn{
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:8px;
  padding:7px 12px;
  color:var(--ink-soft);
  text-decoration:none;
  font-size:13px;
  font-weight:580;
  white-space:nowrap;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  transition:border-color .14s,background .14s;
}
.link-btn:hover{
  border-color:#b7c5b4;
  background:var(--paper);
}

/* Compact player strip */
.player-box{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px 18px 12px;
}
.player-main{
  display:flex;
  align-items:center;
  gap:16px;
}
.controls{
  display:flex;
  align-items:center;
  gap:6px;
  flex:0 0 auto;
}
.control{
  border:0;
  background:transparent;
  color:#4f5e55;
  width:34px;
  height:34px;
  border-radius:8px;
  display:grid;
  place-items:center;
  cursor:pointer;
}
.control:hover{
  background:#e6ebe2;
  color:var(--ink);
}
.play{
  width:46px;
  height:46px;
  border:0;
  border-radius:50%;
  background:var(--forest);
  color:var(--accent-bright);
  display:grid;
  place-items:center;
  cursor:pointer;
  flex:0 0 auto;
  transition:transform .1s;
}
.play:active{transform:scale(.96)}

.wave-wrap{
  flex:1;
  min-width:0;
}
.wave{
  height:38px;
  display:flex;
  align-items:center;
  gap:3px;
  cursor:pointer;
  touch-action:none;
  user-select:none;
  position:relative;
  overflow:hidden;
}
.wave:before{
  content:"";
  position:absolute;
  z-index:2;
  left:var(--progress,0%);
  top:0;
  bottom:0;
  width:2px;
  background:var(--accent);
  pointer-events:none;
}
.bar{
  flex:1;
  max-width:5px;
  min-width:2px;
  height:var(--h);
  border-radius:3px;
  background:#d5ddd2;
}
.bar.played{
  background:#7eab59;
}
.time-row{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
  font-size:12.5px;
  margin-top:4px;
}

.player-right{
  display:flex;
  align-items:center;
  gap:10px;
  flex:0 0 auto;
}
.speed{
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:8px;
  padding:7px 10px;
  font-size:13px;
  font-weight:600;
  color:var(--ink-soft);
  cursor:pointer;
}

/* Slim transcript toolbar */
.trans-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-top:12px;
}
.sync-meta{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12.5px;
  color:var(--muted);
}
.chip{
  color:#3e6c38;
  background:var(--accent-soft);
  border-radius:5px;
  font-size:11px;
  font-weight:750;
  letter-spacing:.06em;
  padding:4px 8px;
}
.trans-tools{
  display:flex;
  align-items:center;
  gap:8px;
}
.trans-search{
  border:1px solid var(--line);
  border-radius:8px;
  width:220px;
  padding:7px 11px;
  font-size:13.5px;
  background:var(--surface);
  color:var(--ink);
  outline:none;
}
.trans-search:focus{
  border-color:#9fc480;
  box-shadow:0 0 0 3px rgba(107,155,71,.12);
}
.clear-btn{
  border:0;
  background:transparent;
  color:var(--muted);
  font-size:13px;
  font-weight:550;
  cursor:pointer;
  padding:6px 8px;
  border-radius:6px;
}
.clear-btn:hover{
  background:var(--paper);
  color:var(--ink);
}

/* Transcript reading area */
.transcript-scroll{
  flex:1;
  overflow-y:auto;
  padding:20px 36px 56px;
  scroll-behavior:smooth;
}
.transcript{
  max-width:920px;
  margin:0 auto;
}
.segment{
  position:relative;
  display:grid;
  grid-template-columns:72px minmax(0,1fr);
  gap:18px;
  padding:18px 20px 18px 16px;
  margin:0 -16px 4px;
  border-radius:12px;
  border-left:3px solid transparent;
  cursor:pointer;
  transition:background .12s,border-color .12s;
}
.segment:hover{
  background:#fafbf8;
}
.segment.active{
  background:var(--accent-soft);
  border-left-color:var(--accent);
}
.segment.hidden{
  display:none;
}
.segment-time{
  padding-top:3px;
  color:var(--muted-light);
  font-size:13.5px;
  font-weight:550;
  font-variant-numeric:tabular-nums;
}
.segment.active .segment-time{
  color:#486e39;
  font-weight:650;
}
.segment-body{
  min-width:0;
}
.speaker-row{
  display:flex;
  align-items:baseline;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:6px;
}
.speaker-name{
  color:var(--ink);
  font-weight:700;
  font-size:15px;
}
.speaker-role{
  color:var(--muted);
  font-size:13.5px;
}
.segment-text{
  color:var(--ink-soft);
  font-size:17.5px;
  line-height:1.72;
  margin:0;
  letter-spacing:-.005em;
}
.segment.active .segment-text{
  color:#142119;
}
.word{
  border-radius:3px;
  transition:background .08s;
}
.word:hover{
  background:#e6f0da;
}
.word.active-word{
  background:var(--word-hl);
  color:#132717;
  box-shadow:0 0 0 2px var(--word-hl);
}
.segment mark{
  background:#fff0a6;
  color:inherit;
  border-radius:3px;
  padding:0 2px;
}
.empty-transcript{
  padding:64px 20px;
  text-align:center;
  color:var(--muted);
  font-size:16px;
}

/* Toast + Import Modal */
.toast{
  position:fixed;
  left:50%;
  bottom:24px;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  background:var(--forest);
  color:#eff5ed;
  font-size:14px;
  padding:11px 16px;
  border-radius:10px;
  box-shadow:0 8px 24px rgba(0,0,0,.16);
  transition:.22s;
  z-index:30;
}
.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}
.backdrop{
  display:none;
  position:fixed;
  inset:0;
  z-index:40;
  background:rgba(13,23,24,.42);
  backdrop-filter:blur(3px);
  align-items:center;
  justify-content:center;
  padding:18px;
}
.backdrop.open{display:flex}
.modal{
  width:min(580px,100%);
  max-height:90vh;
  overflow:auto;
  background:var(--surface);
  border-radius:16px;
  box-shadow:0 24px 80px rgba(0,0,0,.22);
}
.modal-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  padding:22px 24px 16px;
  border-bottom:1px solid var(--line);
}
.modal-head h2{
  font-size:20px;
  letter-spacing:-.03em;
  margin:0 0 4px;
}
.modal-head p{
  margin:0;
  color:var(--muted);
  font-size:13.5px;
}
.close{
  border:0;
  background:var(--paper);
  border-radius:8px;
  width:32px;
  height:32px;
  cursor:pointer;
  color:var(--muted);
  font-size:18px;
  display:grid;
  place-items:center;
}
.modal-body{padding:20px 24px 24px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:grid;gap:6px;margin-bottom:12px}
.field.full{grid-column:1/-1}
.field label{color:var(--ink-soft);font-size:13px;font-weight:620}
.field input,.field textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:9px;
  padding:10px 12px;
  outline:none;
  font-size:14px;
  color:var(--ink);
  background:#fcfdfb;
}
.field input:focus,.field textarea:focus{
  border-color:#9fc480;
  box-shadow:0 0 0 3px rgba(107,155,71,.12);
}
.field textarea{
  min-height:130px;
  resize:vertical;
  line-height:1.55;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:12.5px;
}
.helper{color:var(--muted);font-size:12.5px;line-height:1.5;margin:-4px 0 12px}
.format-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:-2px 0 6px}
.format-row button{border:0;background:transparent;color:#4a733a;cursor:pointer;font-size:12.5px;text-decoration:underline;padding:0}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding-top:6px}
.btn{
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:9px;
  padding:10px 15px;
  cursor:pointer;
  font-size:14px;
  font-weight:600;
  color:var(--ink-soft);
}
.btn.primary{
  background:var(--accent-bright);
  border-color:var(--accent-bright);
  color:var(--forest);
}
.btn.primary:hover{background:#a9e75b}

/* Responsive */
@media(max-width:900px){
  .app{grid-template-columns:1fr;height:auto;overflow:visible}
  .companies{height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .call-list{flex-direction:row;overflow-x:auto;padding:10px 14px}
  .call-card{min-width:220px;flex:0 0 auto}
  .companies-foot{display:none}
  .reader{height:auto}
  .reader-top{position:sticky;top:0;z-index:10;padding:16px 18px 14px}
  .transcript-scroll{padding:14px 18px 40px;overflow:visible}
  .player-main{flex-wrap:wrap;gap:12px}
  .wave-wrap{order:3;flex-basis:100%}
  .trans-bar{flex-wrap:wrap}
  .trans-search{width:100%;flex:1}
  .segment{grid-template-columns:56px minmax(0,1fr);gap:12px;padding:14px 12px;margin:0 -12px 4px}
  .segment-text{font-size:16.5px}
}
@media(max-width:560px){
  .call-header{flex-direction:column;gap:10px}
  .form-grid{grid-template-columns:1fr}
  .field.full{grid-column:auto}
}
</style>
</head>
<body>
<div class="app">
  <aside class="companies" aria-label="Companies">
    <div class="companies-head">
      <div class="companies-title-row">
        <span class="companies-title">Companies</span>
        <span class="count" id="callCount">8</span>
      </div>
      <label class="filter">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.4"/><path d="m10.5 10.5 3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <input id="companySearch" type="search" placeholder="Filter companies…">
      </label>
    </div>
    <div class="call-list" id="callList"></div>
    <div class="companies-foot">
      <button class="add-link" id="libraryAdd" type="button">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Add a call
      </button>
    </div>
  </aside>

  <main class="reader">
    <div class="reader-top">
      <div class="reader-top-inner">
        <div class="call-header">
          <div>
            <h1 id="companyName">Aditya Infotech Limited</h1>
            <div class="call-sub">
              <span id="callTitle"></span>
              <i class="sep"></i>
              <span id="callDate"></span>
              <i class="sep"></i>
              <span id="tickerPill"></span>
            </div>
          </div>
          <div class="header-links">
            <button class="link-btn" id="copyAiLink" type="button" title="Copy public plain-text transcript URL for Claude / AI">Copy AI link</button>
            <a class="link-btn" id="pdfLink" target="_blank" rel="noopener">PDF ↗</a>
            <a class="link-btn" id="sourceLink" target="_blank" rel="noopener">Source ↗</a>
          </div>
        </div>

        <div class="player-box">
          <div class="player-main">
            <div class="controls">
              <button class="control" id="prev" aria-label="Previous segment" title="Previous segment"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M4 3.5v11M14 4.2 6.5 9l7.5 4.8V4.2Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></button>
              <button class="control" id="back" aria-label="Back 15 seconds" title="Back 15 seconds"><svg width="21" height="21" viewBox="0 0 20 20" fill="none"><path d="M4.2 7.3A6.6 6.6 0 1 1 3.5 11M4.2 3.8v3.8H8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="6.1" y="12.7" font-size="5.6" fill="currentColor" font-family="sans-serif" font-weight="600">15</text></svg></button>
              <button class="play" id="play" aria-label="Play call"><svg id="playIcon" width="18" height="18" viewBox="0 0 18 18" fill="currentColor"><path d="M5.7 3.8c0-.6.7-1 1.2-.6l7 5.1a.9.9 0 0 1 0 1.4l-7 5.1c-.5.4-1.2 0-1.2-.6V3.8Z"/></svg></button>
              <button class="control" id="forward" aria-label="Forward 30 seconds" title="Forward 30 seconds"><svg width="21" height="21" viewBox="0 0 20 20" fill="none"><path d="M15.8 7.3A6.6 6.6 0 1 0 16.5 11m-.7-7.2v3.8H12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="5.9" y="12.7" font-size="5.6" fill="currentColor" font-family="sans-serif" font-weight="600">30</text></svg></button>
              <button class="control" id="next" aria-label="Next segment" title="Next segment"><svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M14 3.5v11M4 4.2 11.5 9 4 13.8V4.2Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></button>
            </div>

            <div class="wave-wrap">
              <div class="wave" id="wave" role="slider" tabindex="0" aria-label="Seek through call"><div id="bars" style="display:contents"></div></div>
              <div class="time-row"><span id="nowLabel">00:00</span><span id="durationLabel">00:00</span></div>
            </div>

            <div class="player-right">
              <select id="speed" class="speed" aria-label="Playback speed">
                <option value=".75">0.75×</option>
                <option value="1" selected>1×</option>
                <option value="1.25">1.25×</option>
                <option value="1.5">1.5×</option>
                <option value="2">2×</option>
              </select>
            </div>
          </div>
        </div>

        <div class="trans-bar">
          <div class="sync-meta">
            <span class="chip" id="chip">WORD SYNC</span>
            <span id="note"></span>
          </div>
          <div class="trans-tools">
            <input id="transSearch" class="trans-search" type="search" placeholder="Find in transcript…">
            <button class="clear-btn" id="showAll" type="button">Clear</button>
          </div>
        </div>
      </div>
    </div>

    <div class="transcript-scroll" id="transcriptScroll">
      <div class="transcript" id="transcript" aria-live="polite"></div>
    </div>
    <audio id="audio" preload="metadata"></audio>
  </main>
</div>

<div class="toast" id="toast" role="status"></div>

<div class="backdrop" id="backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <div class="modal-head">
      <div><h2 id="modalTitle">Add an earnings call</h2><p>Import audio and a transcript to follow along in sync.</p></div>
      <button class="close" id="close" aria-label="Close">×</button>
    </div>
    <form id="form" class="modal-body">
      <div class="form-grid">
        <div class="field"><label for="inCompany">Company name</label><input id="inCompany" required placeholder="e.g. Example Industries Ltd."></div>
        <div class="field"><label for="inTicker">Ticker / exchange</label><input id="inTicker" placeholder="e.g. EXAMPLE · NSE"></div>

        <div class="field full"><label for="inAudio">Call audio file</label><input id="inAudio" type="file" accept="audio/*"><div class="helper">Choose an audio file from your device. It stays local in this browser tab.</div></div>
        <div class="field full"><div class="format-row"><label for="inTranscript">Transcript</label><button type="button" id="modalTemplate">Download JSON example</button></div><textarea id="inTranscript" required placeholder="Paste JSON segments or lines in this format:
00:00:08 | Speaker Name | Welcome to the call…
00:00:17 | CFO | Revenue grew…"></textarea></div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn" id="cancel">Cancel</button>
        <button type="submit" class="btn primary">Add to library</button>
      </div>
    </form>
